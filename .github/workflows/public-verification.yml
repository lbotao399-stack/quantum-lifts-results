name: Public exact verification
on:
  push:
    paths:
      - 'algorithms/**'
      - 'research-roadmap/**'
      - '.github/workflows/public-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research-roadmap/verification/requirements.txt
      - name: Install declared dependencies
        run: python -m pip install -r research-roadmap/verification/requirements.txt
      - name: Verify exact certificates and reject corrupted input
        run: python -B research-roadmap/verification/run.py --output "$RUNNER_TEMP/public-verification"
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-exact-verification
          path: ${{ runner.temp }}/public-verification
          if-no-files-found: error
